<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <h3>nama : ichlas bintang saputra</h3>
    <h3>NIM : 20240140101</h3>

    <p>
        kota :
        span id="kota"></span>
    </p>

    <hr>

    <p>
        kordinat:
        span id="negara"></span>
    </p>

    <script>
      fetch("/api/lokasi")
        .then(response => response.json())
        .then(data => {
          console.log(data);
          document.getElementById("lokasi").innerHTML = data.kota;
          document.getElementById("negara").innerHTML = data.koordinat;
        })
        .catch(error => {
          console.error(error);
        });
    </script>

</body>
</html>
